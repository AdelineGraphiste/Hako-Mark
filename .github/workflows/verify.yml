name: Vérifier Hako Mark

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Compiler
        run: dotnet build HakoMark.sln -c Release
      - name: Tester
        run: dotnet run --project tests/HakoMark.Tests -c Release
      - name: Construire l’installeur
        shell: pwsh
        run: ./installer/Build-Installer.ps1
